# Release: triggered by a `v*.*.*` tag.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate the tag and pick the channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.channel.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the tag
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a semantic version tag (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not point to a commit of the 'main' branch."
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            channel=staging
          else
            channel=production
          fi

          echo "Releasing $GITHUB_REF_NAME on the $channel channel"
          echo "value=$channel" >> "$GITHUB_OUTPUT"

  build:
    name: Build the release binaries
    needs: prepare
    uses: ./.github/workflows/build-artifacts.yml
    with:
      channel: ${{ needs.prepare.outputs.channel }}
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
      security-events: write

  publish:
    name: Publish the GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write        # provenance attestation
      attestations: write

    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist

      - name: Attest the build provenance (production only)
        if: needs.prepare.outputs.channel == 'production'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/z-linux-amd64
            dist/z-linux-arm64
            dist/z-compiler.jar
            dist/z-compiler-sbom.json

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Z-Compiler ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.channel == 'staging' }}
          make_latest: ${{ needs.prepare.outputs.channel == 'production' }}
          fail_on_unmatched_files: true
          files: |
            dist/z-linux-amd64
            dist/z-linux-arm64
            dist/z-compiler.jar
            dist/z-compiler-sbom.json
            dist/SHA256SUMS.txt
