name: Static analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spotbugs:
    name: SpotBugs (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run SpotBugs
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -Pstatic-analysis -DskipTests compile spotbugs:spotbugs

      - name: Upload the SARIF report
        if: always() && hashFiles('target/spotbugsSarif.json') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/spotbugsSarif.json
          category: spotbugs

      - name: Upload the SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: |
            target/site/spotbugs.html
            target/spotbugsXml.xml
            target/spotbugsSarif.json
          if-no-files-found: ignore
          retention-days: 7
