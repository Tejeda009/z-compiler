version: 2.1

orbs:
  codecov: codecov/codecov@6.0.0

jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - run:
          name: Run tests and collect coverage
          command: mvn -B clean verify
      - codecov/upload:
          files: target/site/jacoco/jacoco.xml

workflows:
  build-test:
    jobs:
      - build
